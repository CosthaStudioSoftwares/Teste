<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stolinx - Ativação (Design Sofisticado)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <style>
        /* --- FONTES E ÍCONES --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/icon?family=Material+Icons+Sharp');

        /* --- VARIÁVEIS DE CORES E ESTILOS --- */
        :root {
            --color-primary: #007BFF;
            --color-primary-variant: #0056b3;
            --color-danger: #DC3545;
            --color-success: #28A745;
            --color-warning: #FFC107;
            --color-white: #FFFFFF;
            --color-dark: #212529;
            --color-background: #F8F9FA;
            --color-card-bg: #FFFFFF;
            --color-text: #212529;
            --color-text-muted: #6C757D;
            --color-border: #212529; /* Borda escura para o estilo */

            --card-border-radius: 0.8rem;
            --border-radius-2: 0.5rem;
            --box-shadow: 4px 4px 0px 0px var(--color-dark);
            --transition-main: all 0.2s ease-in-out;
        }

        /* --- ESTILOS GERAIS --- */
        * { margin: 0; padding: 0; outline: 0; appearance: none; border: 0; text-decoration: none; list-style: none; box-sizing: border-box; }
        html { font-size: 14px; }
        body {
            width: 100vw;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            background-color: var(--color-background);
            color: var(--color-text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* --- CONTAINER DE AUTENTICAÇÃO --- */
        .auth-form-wrapper {
            width: 100%;
            max-width: 450px;
            background: var(--color-card-bg);
            padding: 2.5rem;
            border-radius: var(--card-border-radius);
            border: 2px solid var(--color-border);
            box-shadow: var(--box-shadow);
        }

        .auth-form-wrapper h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .auth-form-wrapper p {
            text-align: center;
            color: var(--color-text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border-radius: var(--border-radius-2);
            background: var(--color-background);
            font-family: 'Poppins', sans-serif;
            color: var(--color-text);
            font-size: 1rem;
            border: 2px solid var(--color-border);
            transition: var(--transition-main);
        }

        .input-group input:focus {
            border-color: var(--color-primary);
            background: var(--color-white);
        }

        button {
            padding: 14px 24px;
            border-radius: var(--border-radius-2);
            background: var(--color-primary);
            color: #fff;
            cursor: pointer;
            transition: var(--transition-main);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: 2px solid var(--color-dark);
            box-shadow: 2px 2px 0px 0px var(--color-dark);
            margin-top: 1rem;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px 0px var(--color-dark);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px var(--color-dark);
        }
        
        .btn-success { background: var(--color-success); }

        .auth-toggle-link, .support-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--color-primary);
            cursor: pointer;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }

        #activation-message {
            text-align: center;
            padding: 12px;
            border-radius: var(--border-radius-2);
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
            color: var(--color-white);
            border: 2px solid var(--color-dark);
        }
        
        #activation-message.success { background-color: var(--color-success); }
        #activation-message.error { background-color: var(--color-danger); }
    </style>
</head>
<body>
    <div class="auth-form-wrapper">
        <form id="activation-form">
            <h1>Ativação Necessária</h1>
            <p id="activation-prompt-message">Sua conta não está ativa. Por favor, insira o código de ativação que você recebeu.</p>
            <div id="activation-message"></div>
            <div class="input-group">
                <input type="text" id="activation-code" placeholder="Cole seu código de ativação aqui" required>
            </div>
            <button type="submit" class="btn-success">Ativar</button>
            <a class="support-link" href="https://wa.me/5579999462052?text=Olá,%20eu%20quero%20ativar%20o%20meu%20login%20no%20Stolinx" target="_blank">Não tem um código? Suporte</a>
            <a class="auth-toggle-link" id="activation-logout">Sair</a>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="auth.js"></script>
</body>
</html>
