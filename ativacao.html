<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stolinx - Ativação</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="activation-container" style="display: flex;">
        <div class="auth-form-wrapper">
            <form id="activation-form">
                <h1>Ativação Necessária</h1>
                <p id="activation-prompt-message">Sua conta não está ativa. Por favor, insira o código de ativação que você recebeu.</p>
                <div id="activation-message"></div>
                <div class="input-group">
                    <input type="text" id="activation-code" placeholder="Cole seu código de ativação aqui" required>
                </div>
                <button type="submit" class="btn-success">Ativar</button>
                <a class="support-link" href="https://wa.me/5579999462052?text=Olá,%20eu%20quero%20ativar%20o%20meu%20login%20no%20Stolinx" target="_blank">Não tem um código? Suporte via WhatsApp</a>
                <a class="auth-toggle-link" id="activation-logout">Sair</a>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAv54tgJ5oYrwTSNXpB2rCGjNbhJhe2CoM",
            authDomain: "stolinx-d6e26.firebaseapp.com",
            projectId: "stolinx-d6e26",
            storageBucket: "stolinx-d6e26.appspot.com",
            messagingSenderId: "715535971682",
            appId: "1:715535971682:web:66620d1590ae3e4ba6a83b"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const activationForm = document.getElementById('activation-form');
        const activationMessage = document.getElementById('activation-message');
        let currentUserId = null;

        function showActivationMessage(message, type = 'error') {
            activationMessage.textContent = message;
            activationMessage.className = type;
            activationMessage.style.display = 'block';
        }
        
        activationForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const code = document.getElementById('activation-code').value.trim();
            if (!code || !currentUserId) {
                showActivationMessage('Por favor, insira um código válido.');
                return;
            }

            const activationCodeRef = db.collection('activationCodes').doc(code);
            activationCodeRef.get().then(doc => {
                if (doc.exists) {
                    const codeData = doc.data();
                    if (codeData.usedBy) {
                        showActivationMessage('Este código já foi utilizado.');
                    } else {
                        const userRef = db.collection('users').doc(currentUserId);
                        const expirationDate = new Date();
                        expirationDate.setDate(expirationDate.getDate() + codeData.durationDays);

                        const batch = db.batch();
                        batch.update(activationCodeRef, { usedBy: currentUserId, usedAt: firebase.firestore.FieldValue.serverTimestamp() });
                        batch.update(userRef, { active: true, expiresAt: expirationDate });

                        return batch.commit().then(() => {
                            showActivationMessage('Conta ativada com sucesso! Redirecionando...', 'success');
                            setTimeout(() => window.location.href = 'dashboard.html', 1500);
                        });
                    }
                } else {
                    showActivationMessage('Código de ativação inválido.');
                }
            }).catch(error => {
                console.error("Error activating account:", error);
                showActivationMessage('Ocorreu um erro ao ativar a conta.');
            });
        });

        document.getElementById('activation-logout').addEventListener('click', () => {
            auth.signOut();
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserId = user.uid;
                const userRef = db.collection('users').doc(user.uid);
                userRef.get().then(doc => {
                    if (doc.exists) {
                        const userData = doc.data();
                        const now = new Date();
                        if (userData.active && userData.expiresAt && userData.expiresAt.toDate() > now) {
                            window.location.href = 'dashboard.html';
                        } else {
                             document.getElementById('activation-prompt-message').textContent = `Sua conta (${user.email}) não está ativa ou expirou. Insira um novo código de ativação.`;
                        }
                    }
                });
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
